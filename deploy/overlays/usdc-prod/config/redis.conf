# Redis configuration for learn.usdcglobal.com.
#
# Overrides base only to bring maxmemory in step with this tenant's much smaller
# container. Base is sized for jain (3gb against a 3Gi request / 4Gi limit);
# usdc's Redis requests 128Mi, and leaving base's 3gb here would tell Redis it
# may grow to twelve times what the scheduler set aside for it. The live value
# was 5gb against a 256Mi request -- twenty times over, and the reason this file
# exists rather than simply inheriting base.
#
# Everything below this header is base/config/redis.conf verbatim apart from the
# maxmemory line and its comment.

# Network
port 6379
bind 0.0.0.0
tcp-backlog 2048
timeout 0
tcp-keepalive 300

# Memory management
# Kept in step with patch-redis.yaml, which requests 128Mi and caps this pod at 512Mi.
# Measured use is 4Mi. 256mb is ~60x that and still half the container ceiling, so LRU
# evicts long before the kernel would. Raise BOTH together or not at all.
maxmemory 256mb
# WARNING: eviction is instance-wide, and this instance holds sessions as well as cache.
# If Redis ever fills, LRU will start discarding SESSION keys and logging users out, not
# just cache entries. `redis-cli info stats | grep evicted_keys` must stay at 0; if it does
# not, give the cache its own instance rather than raising maxmemory here.
maxmemory-policy allkeys-lru

# Persistence - disabled for session store (optional, disable for cache-only)
# NOTE: with save "" and appendonly no there is NO persistence, so any restart of this pod
# -- including one caused by editing the resources in redis.yaml -- drops every session and
# logs the whole site out. Treat Redis pod changes as user-visible, not routine.
save ""
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
appendonly no

# Logging
loglevel notice
logfile ""

# Performance optimizations
hz 100
lua-time-limit 5000
slowlog-log-slower-than 10000
slowlog-max-len 256

# Client
databases 16

# Advanced configuration
activerehashing yes
client-output-buffer-limit normal 256mb 128mb 60
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Eviction (optimized for performance)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Threaded I/O (if Redis 6+)
# io-threads 4
# io-threads-do-reads yes
