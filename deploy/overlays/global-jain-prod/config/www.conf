; php-fpm pool for global.onlinejain.com.
;
; Overrides base only on the pool size and the per-process memory cap. Base is
; jain's pool -- 25 workers spawned at start, up to 80 -- which is 25 idle PHP
; processes per pod, and the bulk of the 610-667Mi these pods idle at. Measured
; peak here is 119 distinct users in an hour, ~0.5 requests/second; 8/32 across
; 2 pods is ~64 concurrent requests, and pm=dynamic grows it if that changes.
;
; php_admin_value[memory_limit] drops 3G -> 2G to match $CFG->extramemorylimit in
; this tenant's config.php. The two must move together: php_admin_value is a hard
; ceiling, so Moodle's raise_memory_limit() cannot exceed it, and setting
; extramemorylimit above it would silently do nothing.
;
; Note this governs the FPM pool only. Verifying it with `php -r ini_get(...)`
; from the CLI reports the image's conf.d value instead and looks like a failed
; change -- read this mounted file, or use the FPM status page.
;
; Everything else is base/config/www.conf verbatim.
[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.allowed_clients = 127.0.0.1
listen.backlog = 4096

; ===== PROCESS MANAGEMENT OPTIMIZED FOR HIGH PERFORMANCE =====
pm = dynamic
; Optimized for 12Gi memory with 4G PHP memory limit (avg 150MB per worker including overhead)
; Allows ~80 workers with headroom for nginx and system
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 5000
pm.max_spawn_rate = 16
pm.process_idle_timeout = 30s
pm.status_path = /php_status

; ===== TIMEOUTS FOR VIDEO STREAMING AND LARGE DOWNLOADS =====
; 7200 meant one wedged request could hold a worker for TWO HOURS. With 80 workers per
; pod, a handful of stuck requests (a hung NFS read, a third-party HTTP call with no
; timeout) quietly removes serving capacity with nothing in the logs to show it. 900s is
; still far longer than any legitimate page: the slowest thing measured on this site is
; the forced calendar month view at ~90s, and report-builder exports are well inside it.
;
; Streaming is not a reason to keep it high -- $CFG->xsendfile = 'X-Accel-Redirect' hands
; dataroot files to nginx, so PHP is not holding the connection while a video downloads.
; max_input_time stays high because that governs UPLOAD parsing (3G limit), not execution.
;
; If a legitimate long download ever gets cut off, raise this rather than reverting to
; 7200, and note which endpoint needed it.
request_terminate_timeout = 900
request_slowlog_timeout = 5
slowlog = /proc/self/fd/2

; ===== ACCESS LOGGING (to stdout for Alloy scraping) =====
access.log = /proc/self/fd/1
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%% %{user}C"

; ===== PHP CONFIGURATION OVERRIDES =====
; Increase limits so a single PHP process can handle large imports
php_admin_value[memory_limit] = 2G
; Matches request_terminate_timeout above, so PHP ends the script itself with a catchable
; error and a stack trace instead of FPM killing the worker with nothing logged.
; NOTE this php_admin_value overrides php.ini's max_execution_time = 300 -- php.ini is
; misleading on its own, the effective value is whatever is set here.
php_admin_value[max_execution_time] = 900
php_admin_value[max_input_time] = 7200
php_admin_value[realpath_cache_size] = 16384K
php_admin_value[realpath_cache_ttl] = 600
php_admin_value[upload_max_filesize] = 3G
php_admin_value[post_max_size] = 2G
php_admin_value[max_input_vars] = 5000000
php_admin_value[default_charset] = "UTF-8"

; ===== ERROR LOGGING (to stderr for Alloy scraping) =====
php_admin_value[log_errors] = On
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT
php_admin_flag[display_errors] = Off
php_admin_flag[display_startup_errors] = Off

; ===== SESSION CONFIGURATION =====
php_value[session.save_handler] = redis
php_value[session.save_path] = "tcp://redis-service:6379?prefix=moodle_sess_"
php_value[session.gc_maxlifetime] = 86400

; ===== ENVIRONMENT VARIABLES =====
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; ===== SECURITY =====
security.limit_extensions = .php
