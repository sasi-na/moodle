# Cron environment for global.onlinejain.com.
#
# The live CronJobs carry the database password as a literal in the pod spec,
# readable by anyone with `get cronjob` in the namespace. Both take it from the
# moodle-secrets Secret instead, which is the main reason this patch exists.
#
# MOODLE_DATABASE_PASSWORD is not optional here: config/moodle_config.php reads
# $CFG->dbpass from it, and these jobs mount that same config.php. Without it
# they bootstrap Moodle with an empty password and cannot reach the database.
#
# Resource requests come from measurement, not from base (which is sized for
# jain's adhoc queue at 12Gi/2 CPU) and not from live (1 CPU/4Gi and 2 CPU/12Gi).
# A cron pod on this tenant measures 98m CPU / 325Mi, and these run every 5 and
# 15 minutes, so the request is capacity genuinely held. No limits are set, so a
# heavy adhoc task can still burst to $CFG->extramemorylimit.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: moodle-cron
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: moodle-cron
            resources:
              requests:
                memory: "1Gi"
                cpu: "250m"
            env:
            - name: MOODLE_DOCKER_DBTYPE
              value: "mysqli"
            - name: MOODLE_DOCKER_DBHOST
              value: "mysql-db-pxc-db-haproxy"
            - name: MOODLE_DOCKER_DBNAME
              value: "moodledb"
            - name: MOODLE_DOCKER_DBUSER
              value: "moodleuser"
            - name: MOODLE_DOCKER_DBPASS
              valueFrom:
                secretKeyRef:
                  name: moodle-secrets
                  key: database-password
            - name: MOODLE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moodle-secrets
                  key: database-password
            - name: MOODLE_DOCKER_PREFIX
              value: "acu_"
            - name: MOODLE_DOCKER_WWWROOT
              # Must match $CFG->wwwroot. Cron builds the absolute URLs in emails
              # and notifications from this, so a mismatch sends learners links
              # to the wrong host.
              value: "https://global.onlinejain.com"
            - name: PHP_MEMORY_LIMIT
              value: "2G"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: moodle-adhoc-tasks
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: moodle-adhoc-tasks
            resources:
              requests:
                memory: "1Gi"
                cpu: "250m"
            env:
            - name: MOODLE_DOCKER_DBTYPE
              value: "mysqli"
            - name: MOODLE_DOCKER_DBHOST
              value: "mysql-db-pxc-db-haproxy"
            - name: MOODLE_DOCKER_DBNAME
              value: "moodledb"
            - name: MOODLE_DOCKER_DBUSER
              value: "moodleuser"
            - name: MOODLE_DOCKER_DBPASS
              valueFrom:
                secretKeyRef:
                  name: moodle-secrets
                  key: database-password
            - name: MOODLE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moodle-secrets
                  key: database-password
            - name: MOODLE_DOCKER_PREFIX
              value: "acu_"
            - name: MOODLE_DOCKER_WWWROOT
              value: "https://global.onlinejain.com"
            - name: PHP_MEMORY_LIMIT
              value: "2G"
