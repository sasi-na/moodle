# Tenant environment for dev.lms.thekaios.com.
#
# QA's database is a plain `moodle-db` MySQL Deployment in this namespace, not
# the PXC cluster production uses. That is legitimate here -- unlike in
# jo-moodle-prod, where a `moodle-db` reference means something is pointing at an
# abandoned Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle
spec:
  template:
    spec:
      containers:
      - name: php-fpm
        env:
        - name: MOODLE_SITE_URL
          value: "https://dev.lms.thekaios.com"
        - name: ALLOW_EMPTY_PASSWORD
          value: "yes"
        - name: MOODLE_DATABASE_TYPE
          value: "mysqli"
        - name: MOODLE_DATABASE_HOST
          value: "moodle-db"
        - name: MOODLE_DATABASE_PORT_NUMBER
          value: "3306"
        - name: MOODLE_DATABASE_NAME
          value: "moodledb"
        - name: MOODLE_DATABASE_USER
          value: "moodleuser"
        - name: MOODLE_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: moodle-secrets
              key: database-password
        - name: MOODLE_USERNAME
          value: "admin"
        - name: MOODLE_EMAIL
          value: "admin@example.com"
        - name: MOODLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: moodle-secrets
              key: admin-password
        - name: PHP_MEMORY_LIMIT
          value: "2G"
