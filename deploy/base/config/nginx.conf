server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;

    # Allow large POST body
    client_max_body_size 2G;
    client_body_timeout 7200s;

    client_header_timeout 7200s;
    client_body_buffer_size 4M;
    client_header_buffer_size 8k;
    large_client_header_buffers 16 32k;

    keepalive_timeout 3600s;
    keepalive_requests 10000;
    send_timeout 3600s;
    
    # Enable sendfile for better performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ===== GZIP COMPRESSION (OPTIMIZED) =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml
        application/vnd.api+json;
    gzip_disable "msie6";
    
    # Brotli compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml;

    # PHP-FPM timeouts & buffers (OPTIMIZED)
    fastcgi_read_timeout 7200s;       # Match PHP execution time
    fastcgi_send_timeout 7200s;       # Add this
    proxy_read_timeout 7200s;
    fastcgi_buffers 64 64k;
    fastcgi_buffer_size 128k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_temp_file_write_size 256k;

    # Health check endpoint
    location = /healthz.php {
        access_log off;
        allow 127.0.0.1;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block .git and all hidden files/directories
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block sensitive files that must not be publicly accessible
    location ~* ^/(adminer\.php|Dockerfile|\.dockerignore|Makefile)$ {
        deny all;
        return 404;
    }

    # Log to stdout/stderr for Alloy scraping
    error_log /dev/stderr warn;
    access_log /dev/stdout;


    # Deny direct access to moodledata
    location /dataroot/ {
        internal;
        alias /var/moodledata/;
    }

    # PHP processing with "slash arguments"
    location ~ ^(.+\.php)(/.*)$ {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_index index.php;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_request_buffering off;
    }

    # Static file handling
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ===== OPTIMIZED STATIC ASSET CACHING =====
    # CSS and JavaScript with versioning (aggressive caching)
    location ~* \.(js|css)(\?ver=.*)?$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        access_log /dev/stdout;
        open_file_cache max=10000 inactive=30s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
    }

    # Images and media files
    location ~* \.(png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable, max-age=2592000";
        add_header Vary "Accept-Encoding";
        access_log /dev/stdout;
        open_file_cache max=10000 inactive=30s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
    }

    # Fonts and other static assets
    location ~* \.(svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        access_log /dev/stdout;
        open_file_cache max=10000 inactive=30s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
    }
    
    # Open file cache for all files
    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
}
