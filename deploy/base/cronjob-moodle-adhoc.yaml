# Adhoc task processor -- bulk user uploads, bulk email sends.
#
# Same secret handling as cronjob-moodle-cron.yaml: password via secretKeyRef and
# getenv(), never interpolated into the script.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: moodle-adhoc-tasks
  labels:
    app: moodle-adhoc-tasks
spec:
  # Every 15 minutes, matching the cron_keepalive window.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: moodle-adhoc-tasks
        spec:
          # Keep the adhoc runner OFF spot -- see the long note in
          # cronjob-moodle-cron.yaml. This is the job that actually held the
          # orphaned cron_adhoc_task_runner_0 lock on 2026-09-01.
          nodeSelector:
            pool-type: ondemand
          restartPolicy: OnFailure
          containers:
          - name: moodle-adhoc-tasks
            image: moodle-lms
            command:
              - /bin/bash
              - -c
              - |
                set -e
                echo "=== Starting Adhoc Tasks Processor at $(date) ==="

                echo "Waiting for database connection..."
                until php -r '
                  $m = @new mysqli(
                    getenv("MOODLE_DOCKER_DBHOST"),
                    getenv("MOODLE_DOCKER_DBUSER"),
                    getenv("MOODLE_DOCKER_DBPASS"),
                    getenv("MOODLE_DOCKER_DBNAME"),
                    3306
                  );
                  if ($m->connect_error) {
                    echo "Database connection failed: " . $m->connect_error . "\n";
                    exit(1);
                  }
                  echo "Database connected successfully\n";
                  $m->close();
                  exit(0);
                '; do
                  echo "Database not ready, waiting 5 seconds..."
                  sleep 5
                done

                cd /var/www/html

                # Tenant-scoped plugins. The image ships these outside the scanned
                # plugin tree (tenant-plugins/) so no tenant installs them by
                # accident; a tenant that wants one names it in TENANT_PLUGINS.
                #
                # This MUST mirror whatever the tenant's Deployment does. It did not,
                # once: the Deployment copied mod/pdfannotator in via its init
                # container and the CronJobs did not, so cron pods saw the plugin in
                # the database with no code on disk, concluded an upgrade was
                # pending, and suspended themselves. Cron was silently dead for ~24
                # hours -- no Zoom sync, no notifications, no attendance processing.
                for p in $(echo "${TENANT_PLUGINS:-}" | tr ',' ' '); do
                  [ -z "$p" ] && continue
                  if [ -d "/var/www/html/tenant-plugins/$p" ] && [ ! -d "/var/www/html/mod/$p" ]; then
                    echo "Installing tenant plugin: mod/$p"
                    cp -R "/var/www/html/tenant-plugins/$p" "/var/www/html/mod/$p"
                  fi
                done


                # Release claims left by cron pods that died mid-task. With
                # task_adhoc_concurrency_limit=1 a single dead claim stops adhoc
                # processing entirely, and core's own cleanup cannot fix it here
                # because db_record locks stay held for 24h -- see the script's
                # header. Never fatal: a failure here must not stop the runner.
                echo "Releasing stale task claims..."
                php local/useraudit/cli/clear_stale_task_claims.php || \
                  echo "WARNING: stale claim cleanup failed, continuing"

                # task_adhoc_max_runtime (300s) and cron_keepalive (900s) come
                # from config.php.
                echo "Processing adhoc tasks (bulk users, emails, etc.)..."
                php admin/cli/adhoc_task.php --execute --keep-alive=900

                echo "=== Adhoc Tasks completed at $(date) ==="

            resources:
              requests:
                memory: "12Gi"
                cpu: "2"

            volumeMounts:
            - name: moodle-data
              mountPath: /var/moodledata
            - name: moodle-config
              mountPath: /var/www/html/config.php
              subPath: moodle_config.php
              readOnly: true
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/99-moodle.ini
              subPath: php.ini
            - name: tmp-cache
              mountPath: /tmp/moodle-cache

            readinessProbe:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - "test -f /var/www/html/config.php && echo 'Config exists'"
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3

          volumes:
          - name: moodle-data
            persistentVolumeClaim:
              claimName: moodle-nfs-pvc
          - name: moodle-config
            configMap:
              name: moodle-config
              items:
              - key: moodle_config.php
                path: moodle_config.php
          - name: php-config
            configMap:
              name: moodle-config
          - name: tmp-cache
            emptyDir:
              sizeLimit: 2Gi

          securityContext:
            fsGroup: 33
            runAsUser: 33
            runAsGroup: 33
            fsGroupChangePolicy: "OnRootMismatch"
