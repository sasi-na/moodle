# minReplicas tracks patch-scale.yaml.
#
# maxReplicas drops from base's 26 to 4. The ceiling is not a reservation, but it
# is the blast radius of a runaway: base's 26 would let a single pathological
# request storm try to schedule 26 pods on a shared node pool for a site with
# three accounts. Four is more headroom than usdc's traffic can justify and is
# still 2x its steady state.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: moodle-hpa
spec:
  minReplicas: 2
  maxReplicas: 4
