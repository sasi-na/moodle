[PHP]
; ===== MEMORY AND EXECUTION LIMITS =====
memory_limit = 512M
max_execution_time = 300
max_input_time = 7200
max_input_vars = 10000

; ===== FILE UPLOAD CONFIGURATION =====
post_max_size = 512M
upload_max_filesize = 512M
upload_tmp_dir = /var/moodledata/tmp
file_uploads = On
max_file_uploads = 1000

; ===== PERFORMANCE OPTIMIZATIONS =====
realpath_cache_size = 16384K
realpath_cache_ttl = 600

; ===== OUTPUT HANDLING =====
implicit_flush = Off
output_buffering = 4096
zlib.output_compression = On
zlib.output_compression_level = 6

;===== ERROR HANDLING (to stderr for Alloy scraping) =====
; Enabled for staging troubleshooting only - revert after debugging
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
; Show all errors for troubleshooting (including deprecated/strict to see full traces)
error_reporting = E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED

; ===== SESSION CONFIGURATION (Redis) =====
session.save_handler = redis
session.save_path = "tcp://redis-service:6379?prefix=moodle_sess_"
session.gc_maxlifetime = 86400
session.gc_probability = 1
session.gc_divisor = 1000
session.cookie_lifetime = 0
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; ===== SECURITY SETTINGS =====
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
disable_functions = ""

; ===== FILE HANDLING =====
default_charset = "UTF-8"
default_mimetype = "text/html"
date.timezone = UTC

; ===== OPCACHE CONFIGURATION (CRITICAL FOR PERFORMANCE) =====
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 768
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 100000
opcache.max_wasted_percentage = 5
opcache.use_cwd = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.revalidate_path = 0
opcache.save_comments = 1
opcache.load_comments = 1
opcache.fast_shutdown = 1
opcache.enable_file_override = 0
opcache.optimization_level = 0x7FFFBFFF
opcache.consistency_checks = 0
opcache.force_restart_timeout = 180
opcache.log_verbosity_level = 0
opcache.huge_code_pages = 1
opcache.preload = ""
opcache.preload_user = "www-data"
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 0
opcache.file_cache_consistency_checks = 1
