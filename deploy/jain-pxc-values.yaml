# Percona XtraDB Cluster for jo-moodle-prod (jain).
#
# NOT part of the kustomize tree, matching deploy/nitk-pxc-values.yaml and the
# house convention: every tenant's database is a Helm release of the `pxc-db`
# chart and the Percona operator owns the CR lifecycle.
#
# WHY THIS FILE EXISTS. jain's release predates any values file in git, so the
# only record of its configuration was the live cluster. Captured 2026-09-01 from
#
#   helm get values mysql-db -n jo-moodle-prod
#
# release `mysql-db`, revision 4, chart pxc-db-1.20.0.
#
# TWO POST-INSTALL PATCHES ARE FOLDED IN that the installed release does NOT
# have, because they were applied with `kubectl patch` straight to the CR. Both
# are marked at their location below. This matters: `helm upgrade` renders from
# the release's stored values, so upgrading with the values as installed would
# REVERT both -- silently, and one of them protects against an outage that has
# already happened once.
#
#   1. pxc.tolerations -- node.kubernetes.io/memory-pressure / Exists / NoSchedule,
#      added 2026-08-14 after a transient memory-pressure taint stranded the DB
#      (spec.pxc.size is 1, so there is nowhere else for it to go).
#   2. backup.storages.s3-primary.nodeSelector -- pool-type: ondemand, added
#      2026-09-01. Spot preemption of the Moodle cron pods had just frozen all
#      adhoc task processing for 18 hours; the DB backup jobs and the PITR
#      collector were running on spot for the same reason -- nothing pinned them.
#
# DO NOT `helm upgrade` WITH THIS FILE CASUALLY. spec.pxc.size is 1 and
# updateStrategy is SmartUpdate, so anything the operator reads as a pod-template
# change deletes and recreates the single database pod -- about a 3-minute site
# outage, verified 2026-08-14. Diff against `helm get values` first and treat it
# as a planned outage. Changes confined to backup.* do not touch the pxc pod
# template; they roll the PITR collector only (verified 2026-09-01: pxc-0 restart
# count stayed 0).
#
# Node selection uses the `pool-type` label (ondemand|spot) rather than
# cloud.google.com/gke-nodepool, matching pxc.affinity below and surviving a pool
# rename.
annotations: {}
backup:
  enabled: true
  image:
    repository: percona/percona-xtrabackup
    tag: 8.4.0-5.1
  imagePullSecrets: []
  pitr:
    enabled: true
    resources:
      limits: {}
      requests: {}
    storageName: s3-primary
    timeBetweenUploads: 60
    timeoutSeconds: 60
  schedule:
  - keep: 14
    name: daily-backup
    schedule: 0 1 * * *
    storageName: s3-primary
  storages:
    s3-primary:
      # PATCH 1 of 2, applied live 2026-09-01. Keeps the backup jobs and the PITR
      # collector off spot; recorded here so a helm upgrade cannot revert it.
      nodeSelector:
        pool-type: ondemand
      s3:
        bucket: usdc-prod-backup-vault/mysql-backups/jain-online
        credentialsSecret: jain-moodle-s3-credentials
        region: ap-south-1
      type: s3
      verifyTLS: true
crVersion: 1.20.0
enableCRValidationWebhook: false
enableVolumeExpansion: false
finalizers:
- percona.com/delete-pxc-pods-in-order
fullnameOverride: ""
haproxy:
  affinity:
    antiAffinityTopologyKey: kubernetes.io/hostname
  annotations: {}
  enabled: true
  gracePeriod: 30
  image: percona/haproxy:2.8.18-1
  imagePullSecrets: []
  labels: {}
  livenessDelaySec: 300
  livenessProbes:
    failureThreshold: 4
    initialDelaySeconds: 60
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 5
  nodeSelector: {}
  podDisruptionBudget:
    maxUnavailable: 1
  readinessDelaySec: 15
  readinessProbes:
    failureThreshold: 3
    initialDelaySeconds: 15
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 1
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  sidecarPVCs: []
  sidecarResources:
    limits: {}
    requests: {}
  sidecarVolumes: []
  sidecars: []
  size: 1
  tolerations: []
  # Pin to on-demand. IIITD's haproxy was preempted on a spot node on 2026-09-08
  # and the site returned 500 until it rescheduled; at the time IIITD's DATABASE
  # pod was on spot too. With pxc.size=1 there is no second node to fail over to,
  # so a preemption is an outage, not a blip.
  #
  # ⚠️ This is a POD-TEMPLATE change. updateStrategy is SmartUpdate, so the
  # operator deletes and recreates the pod on reconcile -- measured at ~2 minutes
  # with ~80s of 500s on IIITD. Applying this file is a PLANNED-OUTAGE operation,
  # same caveat as the tolerations block above.
  nodeSelector:
    pool-type: ondemand
ignoreAnnotations: []
ignoreLabels: []
logcollector:
  enabled: false
  image: percona/fluentbit:5.0.6-1
  imagePullSecrets: []
  resources:
    limits: {}
    requests:
      cpu: 200m
      memory: 100M
nameOverride: ""
namespace: jo-moodle-prod
operatorImageRepository: percona/percona-xtradb-cluster-operator
pause: false
pmm:
  enabled: false
  image:
    repository: percona/pmm-client
    tag: 3.8.0
  imagePullSecrets: []
  resources:
    limits: {}
    requests:
      cpu: 300m
      memory: 150M
  serverHost: monitoring-service
  serverUser: admin
proxysql:
  affinity:
    antiAffinityTopologyKey: kubernetes.io/hostname
  annotations: {}
  enabled: false
  gracePeriod: 30
  image: percona/proxysql2:2.7.3-1.3
  imagePullSecrets: []
  labels: {}
  nodeSelector: {}
  persistence:
    accessMode: ReadWriteOnce
    enabled: true
    size: 8Gi
  podDisruptionBudget:
    maxUnavailable: 1
  resources:
    limits: {}
    requests:
      cpu: 600m
      memory: 1G
  sidecarPVCs: []
  sidecarResources:
    limits: {}
    requests: {}
  sidecarVolumes: []
  sidecars: []
  size: 3
  tolerations: []
pxc:
  affinity:
    advanced:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: pool-type
              operator: In
              values:
              - ondemand
    antiAffinityTopologyKey: kubernetes.io/hostname
  annotations: {}
  autoRecovery: true
  certManager: false
  clusterSecretName: jain-moodle-pxc-db-secrets
  configuration: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    innodb_buffer_pool_size=48G
    innodb_buffer_pool_instances=12
    innodb_redo_log_capacity=4G
    innodb_log_buffer_size=256M
    innodb_page_cleaners=8
    tmp_table_size=256M
    max_heap_table_size=256M
    max_connections=1200
    max_allowed_packet=128M
    table_open_cache=6000
    table_definition_cache=6000
    thread_cache_size=300
    connect_timeout=10
    wait_timeout=600
    interactive_timeout=600
    net_read_timeout=600
    net_write_timeout=600
    open_files_limit=100000
    innodb_flush_method=O_DIRECT
    innodb_flush_log_at_trx_commit=1
    innodb_read_io_threads=16
    innodb_write_io_threads=16
    innodb_io_capacity=6000
    innodb_io_capacity_max=6000
    innodb_thread_concurrency=0
    innodb_buffer_pool_dump_at_shutdown=ON
    innodb_buffer_pool_load_at_startup=ON
    innodb_stats_on_metadata=OFF
    innodb_stats_persistent=ON
    innodb_stats_persistent_sample_pages=128
    innodb_adaptive_hash_index=ON
    innodb_change_buffering=all
    slow_query_log=1
    slow_query_log_file=/var/log/mysql/slow.log
    long_query_time=2
    log_queries_not_using_indexes=0
    log_throttle_queries_not_using_indexes=10
    [client]
    default-character-set=utf8mb4
    [mysql]
    default-character-set=utf8mb4
  gracePeriod: 600
  image:
    repository: percona/percona-xtradb-cluster
    tag: 8.4.8-8.1
  imagePullSecrets: []
  labels: {}
  livenessDelaySec: 300
  livenessProbes:
    failureThreshold: 3
    initialDelaySeconds: 300
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  nodeSelector: {}
  persistence:
    accessMode: ReadWriteOnce
    enabled: true
    size: 100Gi
    storageClass: pd-ssd-retain-v1
  podDisruptionBudget:
    maxUnavailable: 1
  readinessDelaySec: 15
  readinessProbes:
    failureThreshold: 5
    initialDelaySeconds: 15
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 15
  resources:
    limits:
      cpu: "8"
      memory: 64Gi
    requests:
      cpu: 5500m
      memory: 55Gi
  sidecarPVCs: []
  sidecarResources:
    limits: {}
    requests: {}
  sidecarVolumes: []
  sidecars: []
  size: 1
  # PATCH 2 of 2, applied live 2026-08-14 after a transient memory-pressure taint
  # stranded the database. NOT in the installed release values -- a helm upgrade
  # without this line would strip it and re-expose the cluster.
  tolerations:
  - effect: NoSchedule
    key: node.kubernetes.io/memory-pressure
    operator: Exists
secrets:
  tls: {}
tls:
  enabled: true
unsafeFlags:
  backupIfUnhealthy: true
  proxySize: true
  pxcSize: true
updateStrategy: SmartUpdate
upgradeOptions:
  apply: disabled
  schedule: 0 4 * * *
  versionServiceEndpoint: https://check.percona.com
users:
- dbs:
  - moodledb
  grants:
  - ALL PRIVILEGES
  hosts:
  - '%'
  name: moodleuser
  passwordSecretRef:
    key: MYSQL_MOODLEUSER_PASSWORD
    name: jain-moodle-app-credentials
